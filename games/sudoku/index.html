<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数独 · 小游戏</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../shared/landscape.css">
  <script src="../../shared/icons.js" defer></script>
  <script src="script.js" defer></script>
  <script src="../../shared/interface.js" defer></script>
</head>
<body data-game="sudoku" data-landscape="sudoku" class="sudoku-game">
  <!-- 页面骨架统一；棋盘与游戏规则保持独立实现。 -->
  <header class="game-header">
    <a href="../../index.html"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>游戏大厅</span></a>
    <h1><img src="logo.svg" width="28" height="28" alt="">数独</h1><span aria-hidden="true"></span>
  </header>
  <main class="game-layout">
    <section class="game-stage" aria-label="游戏区域">
      <div class="board">
      <div id="grid" class="grid " aria-label="数独棋盘"></div>
      <div class="cover" id="game-cover" hidden>
    
    <h2 id="cover-title">准备好了吗？</h2>
    <p id="cover-note">点击开始游戏，享受轻松一局。</p>
    <button class="primary" id="cover-action">开始游戏</button>
    
  </div>
    </div>
      <div class="stage-controls"><div id="number-pad" class="number-pad" aria-label="数字键盘"><button data-number="1" aria-label="输入数字1">1</button><button data-number="2" aria-label="输入数字2">2</button><button data-number="3" aria-label="输入数字3">3</button><button data-number="4" aria-label="输入数字4">4</button><button data-number="5" aria-label="输入数字5">5</button><button data-number="6" aria-label="输入数字6">6</button><button data-number="7" aria-label="输入数字7">7</button><button data-number="8" aria-label="输入数字8">8</button><button data-number="9" aria-label="输入数字9">9</button></div><div class="sudoku-tools" data-control-group="actions"><button id="note-mode" aria-pressed="false">笔记</button><button id="erase">擦除</button><button id="undo">撤销</button></div></div><div class="toolbar"><span id="detail"></span><span>轻松一局，专注当下</span></div>
    </section>
    <section class="game-panel" aria-label="游戏信息与操作">
      
      <div class="panel-heading"><h2 >本局游戏</h2><button class="settings-button" id="settings-open" aria-label="打开游戏设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7m4 0h5M4 17h3m4 0h9 M15 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0 M11 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/></svg><span>设置</span></button></div>
      <div class="scores">
        <div class="score-card"><span id="score-label">用时 / 秒</span><strong id="score">0</strong></div>
        <div class="score-card"><span id="best-label">最快 / 秒</span><strong id="best">0</strong></div>
      </div>
      
      <p class="rule-label" id="rule-label">9 × 9 · 行、列、宫内数字不重复</p>
      <div class="game-actions">
        <button class="primary" id="start">开始游戏</button>
        <button id="pause">暂停</button>
        <button id="restart">重新开始</button>
      </div>
      <p class="game-status" id="status" role="status" aria-live="polite">准备好了吗？开始你的第一局。</p>
      <p class="storage" id="storage" role="status"></p>
      
      <details class="instructions" open>
        <summary>操作与规则</summary>
        <p>每行、每列和每个 3×3 宫内填写 1–9 且不能重复。选择空格后使用下方数字键或键盘输入；N 切换笔记，Delete 擦除，Ctrl/Cmd+Z 撤销。首次编辑开始计时。</p>
        <p>打开设置、切换页面或窗口失焦时自动暂停，回来后请手动继续。</p>
      </details>
    </section>
    
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog"><div class="dialog-heading"><h2 id="settings-title">游戏设置</h2><button class="icon-button" aria-label="关闭设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></div></form>
    <label>音效<input id="sound" type="checkbox" role="switch"></label>
    <label>难度<select id="option"><option value="easy">入门</option><option value="normal" selected>标准</option><option value="hard">挑战</option></select></label><label>冲突提示<input id="conflict-check" type="checkbox" checked role="switch"></label>
    <p>设置自动保存在本机，关闭设置后请手动继续。难度在重新开始后生效，冲突提示立即生效。</p>
    
    <button class="primary" id="settings-close">完成设置</button>
  </dialog>
  <footer class="game-footer">小游戏 · 给自己，一局的时间。</footer>
</body>
</html>
