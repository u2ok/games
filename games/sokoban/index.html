<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>推箱子 · 小游戏</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="landscape.css">
  <script src="icons.js" defer></script>
  <script src="script.js" defer></script>
  <script src="interface.js" defer></script>
</head>
<body data-game="sokoban" data-landscape="sokoban">
  <!-- 页面骨架统一；棋盘与游戏规则保持独立实现。 -->
  <header class="game-header">
    <a href="../../index.html"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>游戏大厅</span></a>
    <h1><img src="logo.svg" width="28" height="28" alt="">推箱子</h1><span aria-hidden="true"></span>
  </header>
  <main class="game-layout">
    <section class="game-stage" aria-label="游戏区域">
      <div class="board">
      <div id="grid" class="grid " aria-label="推箱子棋盘"></div>
      <div class="cover" id="game-cover" hidden>
    
    <h2 id="cover-title">准备好了吗？</h2>
    <p id="cover-note">点击开始游戏，享受轻松一局。</p>
    <button class="primary" id="cover-action">开始游戏</button>
    
  </div>
    </div>
      <div class="toolbar"><span id="detail"></span><div class="toolbar-actions"><button id="undo" disabled>撤销一步</button></div></div>
    </section>
    <section class="game-panel" aria-label="游戏信息与操作">
      
      <div class="panel-heading"><h2 >本局游戏</h2><button class="settings-button" id="settings-open" aria-label="打开游戏设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7m4 0h5M4 17h3m4 0h9 M15 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0 M11 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/></svg><span>设置</span></button></div>
      <div class="scores">
        <div class="score-card"><span id="score-label">步数</span><strong id="score">0</strong></div>
        <div class="score-card"><span id="best-label">最少步数</span><strong id="best">0</strong></div>
      </div>
      
      <p class="rule-label" id="rule-label">第 1 关 · 第一步</p>
      <div class="game-actions">
        <button class="primary" id="start">开始游戏</button>
        <button id="pause">暂停</button>
        <button id="restart">重新开始</button>
      </div>
      <p class="game-status" id="status" role="status" aria-live="polite">准备好了吗？开始你的第一局。</p>
      <p class="storage" id="storage" role="status"></p>
      
      <section id="level-section" aria-label="关卡选择"><h3>关卡选择</h3><div id="level-list"></div><p id="level-hint"></p></section><details class="instructions" open>
        <summary>操作与规则</summary>
        <p>方向键/WASD、手机方向按钮或在地图滑动移动角色。箱子只能推，不能拉；每次只能推一个。将所有箱子推到目标上即可过关。按 Z 或点撤销恢复上一步，卡住时可重新开始。</p>
        <p>打开设置、切换页面或窗口失焦时自动暂停，回来后请手动继续。</p>
      </details>
    </section>
    
  <div class="touch-controls direction-pad" aria-label="触屏方向控制"><button data-direction="up" aria-label="向上">↑</button><button data-direction="left" aria-label="向左">←</button><button data-direction="down" aria-label="向下">↓</button><button data-direction="right" aria-label="向右">→</button></div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog"><div class="dialog-heading"><h2 id="settings-title">游戏设置</h2><button class="icon-button" aria-label="关闭设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></div></form>
    <label>音效<input id="sound" type="checkbox" role="switch"></label>
    <label>目标圆点<input id="option" type="checkbox" checked></label>
    <p>设置自动保存在本机，关闭设置后请手动继续。目标点始终保留边框，圆点提示立即生效。</p>
    
    <button class="primary" id="settings-close">完成设置</button>
  </dialog>
  <footer class="game-footer">小游戏 · 给自己，一局的时间。</footer>
</body>
</html>
