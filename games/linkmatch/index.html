<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连连看 · 小游戏</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../shared/icons.js" defer></script>
  <script src="script.js" defer></script>
  <script src="../../shared/interface.js" defer></script>
</head>
<body data-game="linkmatch" data-landscape="linkmatch" class="linkmatch-game">
  <!-- 页面骨架统一；棋盘与游戏规则保持独立实现。 -->
  <header class="game-header">
    <a href="../../index.html" class="hall-link"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>游戏大厅</span></a>
    <h1 class="game-title"><img src="logo.svg" width="28" height="28" alt="" class="game-logo">连连看</h1><span aria-hidden="true"></span>
  </header>
  <main class="game-layout">
    <section class="game-stage" aria-label="游戏区域">
      <div class="board link-board">
      <div id="grid" class="grid" aria-label="连连看棋盘"></div><canvas id="connection-path" width="600" height="600" aria-hidden="true"></canvas>
      <div class="cover" id="game-cover" hidden>
    
    <h2 id="cover-title">准备好了吗？</h2>
    <p id="cover-note">点击开始游戏，享受轻松一局。</p>
    <button class="primary" id="cover-action">开始游戏</button>
    
  </div>
    </div>
      <div class="stage-controls"><button id="hint">提示配对</button><button id="shuffle">重新洗牌</button></div><div class="toolbar"><span id="detail"></span><span>轻松一局，专注当下</span></div>
    </section>
    <section class="game-panel" aria-label="游戏信息与操作">
      
      <div class="panel-heading"><h2 >本局游戏</h2><button class="settings-button" id="settings-open" aria-label="打开游戏设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7m4 0h5M4 17h3m4 0h9 M15 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0 M11 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/></svg><span>设置</span></button></div>
      <div class="scores">
        <div class="score-card"><span id="score-label" class="score-label">用时 / 秒</span><strong id="score" class="score-value">0</strong></div>
        <div class="score-card"><span id="best-label" class="score-label">最快纪录</span><strong id="best" class="score-value">0</strong></div>
      </div>
      
      <p class="rule-label" id="rule-label">标准 · 8 × 8 · 最多两次转弯</p>
      <div class="game-actions">
        <button class="primary" id="start">开始游戏</button>
        <button id="pause">暂停</button>
        <button id="restart">重新开始</button>
      </div>
      <p class="game-status" id="status" role="status" aria-live="polite">准备好了吗？开始你的第一局。</p>
      <p class="storage" id="storage" role="status"></p>
      
      <details class="instructions" open>
        <summary>操作与规则</summary>
        <p>点击两个相同图案，使用最多两次转弯的空白路径连接，允许从棋盘外侧绕行。提示可找出一对，洗牌保留消除进度；无配对时自动重排。首次选择开始计时。</p>
        <p>打开设置、切换页面或窗口失焦时自动暂停，回来后请手动继续。</p>
      </details>
    </section>
    
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog"><div class="dialog-heading"><h2 id="settings-title">游戏设置</h2><button class="icon-button" aria-label="关闭设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></div></form>
    <label>音效<input id="sound" type="checkbox" role="switch"></label>
    <label>难度<select id="option"><option value="easy">轻松 6 × 6</option><option value="normal" selected>标准 8 × 8</option><option value="hard">挑战 10 × 10</option></select></label>
    <p>设置自动保存在本机，关闭设置后请手动继续。难度在重新开始后生效。</p>
    
    <button class="primary" id="settings-close">完成设置</button>
  </dialog>
  <footer class="game-footer">小游戏 · 给自己，一局的时间。</footer>
</body>
</html>
