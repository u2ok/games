<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>贪吃蛇 · 小游戏</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../shared/icons.js" defer></script>
  <script src="script.js" defer></script>
  <script src="../../shared/interface.js" defer></script>
</head>
<body data-game="snake" data-landscape="snake">
  <!-- 页面骨架统一；棋盘与游戏规则保持独立实现。 -->
  <header class="game-header">
    <a href="../../index.html" class="hall-link"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>游戏大厅</span></a>
    <h1 class="game-title"><img src="logo.svg" width="28" height="28" alt="" class="game-logo">贪吃蛇</h1><span aria-hidden="true"></span>
  </header>
  <main class="game-layout">
    <section class="game-stage" aria-label="游戏区域">
      <div class="board-wrap" id="board-wrap">
      <canvas id="board" width="600" height="600" tabindex="0" aria-label="贪吃蛇棋盘，使用方向键或 WASD 控制方向">浏览器需要支持 Canvas。</canvas>
      <div class="cover" id="overlay" >
    <span id="overlay-symbol" aria-hidden="true"></span>
    <h2 id="overlay-title">准备好了吗？</h2>
    <p id="overlay-description">点击开始游戏，享受轻松一局。</p>
    <button class="primary" id="overlay-action">开始游戏</button>
    <button id="replay-level" hidden>重玩本关</button>
  </div>
    </div>
      <div class="toolbar"><span >20 × 20 网格</span><span>轻松一局，专注当下</span></div>
    </section>
    <section class="game-panel" aria-label="游戏信息与操作">
      <div class="mode-switch" aria-label="游戏模式"><button data-mode="classic" aria-pressed="true">经典模式</button><button data-mode="challenge" aria-pressed="false">闯关模式</button></div>
      <div class="panel-heading"><h2 id="panel-title">本局游戏</h2><button class="settings-button" id="open-settings" aria-label="打开游戏设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7m4 0h5M4 17h3m4 0h9 M15 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0 M11 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/></svg><span>设置</span></button></div>
      <div class="scores">
        <div class="score-card"><span id="score-label" class="score-label">得分</span><strong id="score" class="score-value">0</strong></div>
        <div class="score-card"><span id="best-label" class="score-label">最佳</span><strong id="best" class="score-value">0</strong></div>
      </div>
      <progress id="level-progress" value="0" max="1" aria-label="关卡目标进度" hidden></progress>
      <p class="rule-label" id="rule-label">20 × 20 · 标准速度 · 撞墙结束</p>
      <div class="game-actions">
        <button class="primary" id="start">开始游戏</button>
        <button id="pause">暂停</button>
        <button id="restart">重新开始</button>
      </div>
      <p class="game-status" id="status" role="status" aria-live="polite">准备好了吗？开始你的第一局。</p>
      
      <section id="level-section" hidden aria-label="关卡选择"><h3>关卡选择</h3><div id="level-list"></div><p id="level-hint"></p></section>
      <details class="instructions" open>
        <summary>操作与规则</summary>
        <p>方向键或 WASD 控制方向，空格暂停与继续。吃食物 +10 分，撞到身体结束。经典模式可设置穿墙，闯关模式按目标过关。</p>
        <p>打开设置、切换页面或窗口失焦时自动暂停，回来后请手动继续。</p>
      </details>
    </section>
    <div class="touch-controls direction-pad" aria-label="触屏方向控制"><button data-direction="up" aria-label="向上">↑</button><button data-direction="left" aria-label="向左">←</button><button data-direction="down" aria-label="向下">↓</button><button data-direction="right" aria-label="向右">→</button></div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog"><div class="dialog-heading"><h2 id="settings-title">游戏设置</h2><button class="icon-button" aria-label="关闭设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></div></form>
    <label>音效<input id="sound" type="checkbox" role="switch"></label>
    <fieldset><legend>速度</legend><div class="segmented"><label><input type="radio" name="speed" value="slow" ><span>慢速</span></label><label><input type="radio" name="speed" value="normal" checked><span>标准</span></label><label><input type="radio" name="speed" value="fast" ><span>快速</span></label></div></fieldset><fieldset><legend>边界规则</legend><div class="segmented"><label><input type="radio" name="boundary" value="solid" checked><span>撞墙结束</span></label><label><input type="radio" name="boundary" value="wrap" ><span>穿墙模式</span></label></div></fieldset><label>网格辅助线<input id="grid" type="checkbox" checked role="switch"></label>
    <p>设置自动保存在本机，关闭设置后请手动继续。规则设置在新的一局生效。</p>
    <p class="setting-note" id="storage-note" role="status"></p>
    <button class="primary" id="close-settings">完成设置</button>
  </dialog>
  <footer class="game-footer">小游戏 · 给自己，一局的时间。</footer>
</body>
</html>
